<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成长记录 · 1000工作台</title>
    <!-- canvas-confetti CDN 用于礼花动画 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1"></script>
    <style>
        /* ===== CSS Reset & Variables ===== */
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        :root{
            --sidebar-w:210px;
            --bg:#EBF4FC;--card-bg:#fff;--text:#1A2D4A;--text2:#5A718C;
            --accent:#3B82F6;--accent-light:#EFF6FF;
            --success:#10B981;--danger:#EF4444;--warn:#F59E0B;
            --border:rgba(59,130,246,.06);
            --shadow:0 1px 3px rgba(59,130,246,.05),0 4px 16px rgba(59,130,246,.06);
            --radius:14px;--radius-sm:10px;
            /* 彩虹色系 */
            --rainbow-1:#FF6B6B;--rainbow-2:#FFA94D;--rainbow-3:#FFD43B;
            --rainbow-4:#69DB7C;--rainbow-5:#4DABF7;--rainbow-6:#748FFC;--rainbow-7:#DA77F2;
        }
        html{font-size:16px;}
        body{
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
            background:linear-gradient(135deg,#E3F0FD 0%,#F0F4FF 30%,#FDF2F8 60%,#FFF7ED 100%);
            background-attachment:fixed;
            color:var(--text);line-height:1.6;overflow:hidden;height:100dvh;
            -webkit-font-smoothing:antialiased;
        }
        a{color:inherit;text-decoration:none;}
        /* ===== Layout ===== */
        #app{display:flex;height:100dvh;}
        /* ===== Sidebar ===== */
        #sidebar{
            width:var(--sidebar-w);min-width:var(--sidebar-w);
            background:linear-gradient(180deg,#1E3A5F 0%,#2563EB 40%,#3B82F6 70%,#60A5FA 100%);
            display:flex;flex-direction:column;padding:20px 12px;
            gap:3px;overflow-y:auto;user-select:none;z-index:10;
            transition:transform .3s;position:relative;
        }
        /* 彩虹装饰线 */
        #sidebar::after{
            content:'';position:absolute;bottom:0;left:0;right:0;height:3px;
            background:linear-gradient(90deg,var(--rainbow-1),var(--rainbow-2),var(--rainbow-3),var(--rainbow-4),var(--rainbow-5),var(--rainbow-6),var(--rainbow-7));
        }
        .sb-logo{
            font-size:1.15rem;font-weight:800;color:#fff;padding:8px 6px 20px 6px;
            letter-spacing:.03em;white-space:nowrap;
            display:flex;align-items:center;gap:10px;
        }
        .sb-logo .ico{
            font-size:1.6rem;width:40px;height:40px;border-radius:50%;
            background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;
            box-shadow:0 0 20px rgba(147,197,253,.3);
        }
        .sb-logo .sub{display:block;font-size:.6rem;font-weight:400;opacity:.6;margin-top:2px;}
        .nav-item{
            display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
            cursor:pointer;font-size:.82rem;font-weight:600;color:rgba(255,255,255,.6);
            transition:all .2s;white-space:nowrap;border:none;background:none;width:100%;text-align:left;
        }
        .nav-item:hover{background:rgba(255,255,255,.12);color:#fff;}
        .nav-item.active{
            background:rgba(255,255,255,.2);color:#fff;
            box-shadow:0 4px 20px rgba(255,255,255,.15);
            backdrop-filter:blur(10px);
            border:1px solid rgba(255,255,255,.25);
        }
        .sb-footer{margin-top:auto;padding:12px 6px 0 6px;font-size:.62rem;color:rgba(255,255,255,.35);}
        /* Sidebar toggle (mobile) */
        .sb-toggle{
            display:none;position:fixed;top:12px;left:12px;z-index:999;
            width:38px;height:38px;border-radius:10px;border:none;
            background:linear-gradient(135deg,#3B82F6,#2563EB);color:#fff;
            font-size:1.2rem;cursor:pointer;
            box-shadow:0 4px 16px rgba(59,130,246,.35);
        }
        /* ===== Main ===== */
        #main{flex:1;overflow-y:auto;padding:24px;position:relative;}
        #main::-webkit-scrollbar{width:6px;}
        #main::-webkit-scrollbar-track{background:transparent;}
        #main::-webkit-scrollbar-thumb{
            background:linear-gradient(180deg,var(--rainbow-5),var(--rainbow-6),var(--rainbow-7));
            border-radius:3px;
        }
        .panel{display:none;animation:fadeIn .35s ease;}
        .panel.active{display:block;}
        @keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
        /* 顶部彩虹装饰条 */
        #main::before{
            content:'';position:sticky;top:0;left:0;right:0;height:3px;z-index:5;
            background:linear-gradient(90deg,var(--rainbow-1),var(--rainbow-2),var(--rainbow-3),var(--rainbow-4),var(--rainbow-5),var(--rainbow-6),var(--rainbow-7));
            display:block;
        }
        /* ===== Common ===== */
        .card{
            background:var(--card-bg);border-radius:var(--radius);padding:20px;
            box-shadow:0 2px 12px rgba(59,130,246,.06),0 1px 3px rgba(0,0,0,.03);
            margin-bottom:16px;border:1px solid var(--border);
            transition:box-shadow .25s;
        }
        .card:hover{box-shadow:0 4px 20px rgba(59,130,246,.1),0 1px 4px rgba(0,0,0,.04);}
        .card h3{font-size:.95rem;margin-bottom:14px;color:var(--text);display:flex;align-items:center;gap:8px;font-weight:700;}
        .card h4{font-size:.82rem;color:#2C3E5C;margin-bottom:10px;font-weight:700;}
        .pg-title{
            font-size:1.2rem;font-weight:800;color:var(--text);margin-bottom:18px;
            display:flex;align-items:center;gap:10px;
            padding:10px 16px;border-radius:14px;
            background:linear-gradient(135deg,rgba(59,130,246,.06) 0%,rgba(147,197,253,.1) 100%);
            border:1px solid rgba(59,130,246,.1);
        }
        .pg-title .emoji{font-size:1.4rem;}
        /* ===== Buttons ===== */
        .btn{
            display:inline-flex;align-items:center;gap:6px;border:none;padding:9px 18px;
            border-radius:22px;font-size:.78rem;font-weight:600;cursor:pointer;
            transition:all .2s;font-family:inherit;white-space:nowrap;
        }
        .btn:active{transform:scale(.97);}
        .btn-primary{
            background:linear-gradient(135deg,#3B82F6,#2563EB);color:#fff;
            box-shadow:0 4px 14px rgba(59,130,246,.25);
        }
        .btn-primary:hover{box-shadow:0 6px 22px rgba(59,130,246,.4);transform:translateY(-1px);}
        .btn-outline{background:#fff;color:var(--accent);border:1.5px solid var(--accent);}
        .btn-outline:hover{background:var(--accent-light);box-shadow:0 4px 14px rgba(59,130,246,.15);}
        .btn-sm{padding:5px 12px;font-size:.7rem;border-radius:14px;}
        .btn-success{
            background:linear-gradient(135deg,#10B981,#059669);color:#fff;
            font-size:.82rem;padding:10px 22px;
            box-shadow:0 4px 14px rgba(16,185,129,.25);
        }
        .btn-success:hover{box-shadow:0 6px 20px rgba(16,185,129,.4);transform:translateY(-1px);}
        .btn-danger{
            background:linear-gradient(135deg,#EF4444,#DC2626);color:#fff;
            font-size:.82rem;padding:10px 22px;
            box-shadow:0 4px 14px rgba(239,68,68,.25);
        }
        .btn-danger:hover{box-shadow:0 6px 20px rgba(239,68,68,.4);transform:translateY(-1px);}
        .btn-del{background:#FEE2E2;color:#B91C1C;font-size:.68rem;padding:3px 8px;border-radius:8px;}
        /* ===== Tags ===== */
        .tag{display:inline-block;padding:2px 9px;border-radius:10px;font-size:.66rem;font-weight:700;}
        .tag-green{background:#D1FAE5;color:#065F46;}
        .tag-blue{background:#DBEAFE;color:#1E40AF;}
        .tag-orange{background:#FEF3C7;color:#92400E;}
        .tag-red{background:#FEE2E2;color:#991B1B;}
        .tag-rainbow{background:linear-gradient(90deg,var(--rainbow-1),var(--rainbow-2),var(--rainbow-3),var(--rainbow-4),var(--rainbow-5),var(--rainbow-6),var(--rainbow-7));color:#fff;padding:3px 10px;}
        /* ===== Inputs ===== */
        input,textarea,select{
            border:1.5px solid #CBD5E1;border-radius:var(--radius-sm);padding:10px 14px;
            font-size:.8rem;font-family:inherit;outline:none;transition:.2s;width:100%;
            background:#F8FAFC;color:#1A2D4A;
        }
        input:focus,textarea:focus,select:focus{
            border-color:var(--accent);
            box-shadow:0 0 0 3px rgba(59,130,246,.1);
            background:#fff;
        }
        textarea{resize:vertical;min-height:80px;}
        ::placeholder{color:#94A3B8;}
        /* ===== Stats ===== */
        .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:14px;}
        .stat-box{
            background:var(--card-bg);border-radius:12px;padding:16px 12px;text-align:center;
            box-shadow:0 2px 10px rgba(59,130,246,.06);border:1px solid rgba(59,130,246,.08);
            transition:transform .2s,box-shadow .2s;
        }
        .stat-box:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(59,130,246,.12);}
        .stat-box .num{font-size:1.6rem;font-weight:800;color:var(--accent);}
        .stat-box .lbl{font-size:.68rem;color:var(--text2);margin-top:3px;font-weight:500;}
        /* ===== Heatmap ===== */
        .heatmap{display:flex;flex-wrap:wrap;gap:3px;justify-content:flex-start;}
        .heatmap .day{width:12px;height:12px;border-radius:3px;background:#E8ECF2;}
        .heatmap .day.lv1{background:#10B981;}
        .heatmap .day.lv2{background:#F59E0B;}
        .heatmap .day.lv3{background:#EF4444;}
        .heatmap .day.today{border:2px solid #1E293B;}
        /* ===== Mood ===== */
        .mood-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
        .mood-btn{
            width:48px;height:48px;border-radius:50%;border:2px solid transparent;cursor:pointer;
            font-size:1.5rem;display:flex;align-items:center;justify-content:center;
            transition:all .2s;background:#F8FAFC;
        }
        .mood-btn:hover{transform:scale(1.12);}
        .mood-btn.sel{
            border-color:var(--accent);
            box-shadow:0 0 0 5px rgba(59,130,246,.12);
            background:#EFF6FF;
        }
        /* ===== Diet ===== */
        .day-card{
            margin-bottom:14px;border:1.5px solid rgba(59,130,246,.1);border-radius:var(--radius);
            overflow:hidden;background:#fff;
            box-shadow:0 2px 10px rgba(59,130,246,.04);
        }
        .day-card h4{
            background:linear-gradient(135deg,#EFF6FF,#F0F9FF);
            padding:10px 16px;border-bottom:1px solid rgba(59,130,246,.1);font-size:.8rem;
        }
        .meal-row{padding:12px 16px;border-bottom:1px solid #F3F4F6;display:flex;gap:10px;align-items:flex-start;}
        .meal-row:last-child{border-bottom:none;}
        .meal-tag{font-size:.66rem;font-weight:700;padding:3px 9px;border-radius:8px;white-space:nowrap;min-width:46px;text-align:center;}
        .meal-tag.bf{background:#FEF3C7;color:#92400E;}
        .meal-tag.lu{background:#D1FAE5;color:#065F46;}
        .meal-tag.di{background:#EDE9FE;color:#5B21B6;}
        .meal-info{flex:1;min-width:0;}
        .meal-info .name{font-weight:700;font-size:.82rem;}
        .meal-info .detail{font-size:.7rem;color:var(--text2);margin-top:3px;word-break:break-all;}
        .meal-info .steps{font-size:.68rem;color:#8899B4;margin-top:2px;}
        .airfry{display:inline-block;font-size:.64rem;font-weight:700;background:#FFF7ED;color:#C2410C;padding:2px 8px;border-radius:6px;margin-top:4px;}
        .diet-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;}
        .diet-tab{
            border:none;padding:8px 13px;border-radius:20px;font-size:.75rem;font-weight:600;
            cursor:pointer;background:#E2E8F0;color:#64748B;transition:all .2s;
        }
        .diet-tab.on{
            background:linear-gradient(135deg,#3B82F6,#2563EB);color:#fff;
            box-shadow:0 4px 12px rgba(59,130,246,.25);
        }
        /* ===== Ledger ===== */
        .ledger-form{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;}
        .ledger-form input,.ledger-form select{width:auto;flex:1;min-width:80px;}
        .ledger-item{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #F3F4F6;font-size:.78rem;}
        .ledger-item .amt-exp{color:#EF4444;font-weight:700;margin-left:auto;white-space:nowrap;}
        .ledger-item .amt-inc{color:#10B981;font-weight:700;margin-left:auto;white-space:nowrap;}
        .cat-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:8px 0;}
        .cat-bar div{transition:width .5s;}
        .cat-legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.66rem;margin-top:6px;}
        /* ===== Trending V2 · 爆款二创 ===== */
        .trend-cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:14px;}
        /* ===== 品类热点卡片 ===== */
        .trend-card{
            border-radius:var(--radius);padding:16px;border:1.5px solid rgba(59,130,246,.1);
            background:#fff;transition:all .25s;cursor:default;position:relative;
            box-shadow:0 2px 10px rgba(59,130,246,.04);
        }
        .trend-card:hover{
            border-color:var(--accent);
            box-shadow:0 8px 24px rgba(59,130,246,.12);
            transform:translateY(-3px);
        }
        .trend-card .t-cat{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
        .trend-card .t-title{font-weight:700;font-size:.82rem;margin-bottom:4px;line-height:1.3;}
        .trend-card .t-detail{font-size:.68rem;color:var(--text2);line-height:1.5;}
        .trend-card .t-val{font-size:1.2rem;font-weight:800;margin-top:6px;}
        .trend-card .t-note{font-size:.6rem;color:var(--text2);margin-top:2px;}
        /* ===== 热度标签 ===== */
        .tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.62rem;font-weight:700
